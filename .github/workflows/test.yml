name: test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run -s typecheck
      - run: npm test
      # The shipped bundle must match the source it was built from.
      - run: npm run build && git diff --exit-code -- dist INTEGRITY.json
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
